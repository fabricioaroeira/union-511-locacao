<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Fundo arredondado -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Edifício estilizado -->
  <g transform="translate(96 128)">
    <!-- Base / térreo -->
    <rect x="0" y="180" width="320" height="80" fill="white" opacity="0.95" rx="6"/>
    <!-- Janelas térreo (lojas) -->
    <rect x="20" y="200" width="32" height="40" fill="#1e3a8a" rx="2"/>
    <rect x="64" y="200" width="32" height="40" fill="#1e3a8a" rx="2"/>
    <rect x="108" y="200" width="32" height="40" fill="#1e3a8a" rx="2"/>
    <rect x="152" y="200" width="32" height="40" fill="#1e3a8a" rx="2"/>
    <rect x="196" y="200" width="32" height="40" fill="#1e3a8a" rx="2"/>
    <rect x="240" y="200" width="32" height="40" fill="#1e3a8a" rx="2"/>
    <rect x="284" y="200" width="20" height="40" fill="#1e3a8a" rx="2"/>

    <!-- Andares superiores -->
    <rect x="40" y="0" width="240" height="180" fill="white" opacity="0.95" rx="6"/>
    <!-- Janelas andares -->
    <g fill="#1e3a8a" opacity="0.85">
      <rect x="60"  y="20" width="24" height="32" rx="2"/>
      <rect x="96"  y="20" width="24" height="32" rx="2"/>
      <rect x="132" y="20" width="24" height="32" rx="2"/>
      <rect x="168" y="20" width="24" height="32" rx="2"/>
      <rect x="204" y="20" width="24" height="32" rx="2"/>
      <rect x="240" y="20" width="24" height="32" rx="2"/>

      <rect x="60"  y="64" width="24" height="32" rx="2"/>
      <rect x="96"  y="64" width="24" height="32" rx="2"/>
      <rect x="132" y="64" width="24" height="32" rx="2"/>
      <rect x="168" y="64" width="24" height="32" rx="2"/>
      <rect x="204" y="64" width="24" height="32" rx="2"/>
      <rect x="240" y="64" width="24" height="32" rx="2"/>

      <rect x="60"  y="108" width="24" height="32" rx="2"/>
      <rect x="96"  y="108" width="24" height="32" rx="2"/>
      <rect x="132" y="108" width="24" height="32" rx="2"/>
      <rect x="168" y="108" width="24" height="32" rx="2"/>
      <rect x="204" y="108" width="24" height="32" rx="2"/>

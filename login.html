<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Union 511</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#707272">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f6f3; --card:#ffffff; --ink:#2c2c2a; --ink-soft:#5f5e5a;
    --line:#e6e3db; --accent:#F7A520; --accent-hover:#d98910;
    --brand-gray:#707272;
    --red:#b91c1c; --red-soft:#fee2e2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',sans-serif;background:var(--brand-gray);color:var(--ink);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background-image:radial-gradient(circle at 20% 20%, rgba(247,165,32,0.10) 0, transparent 45%),
                     radial-gradient(circle at 80% 80%, rgba(247,165,32,0.08) 0, transparent 45%)
  }
  .login-box{
    background:var(--card);border-radius:14px;padding:40px 36px;width:100%;max-width:400px;
    border-top:4px solid var(--accent);
    box-shadow:0 12px 32px rgba(0,0,0,0.18);
  }
  .logo{display:flex;align-items:center;justify-content:center;margin-bottom:20px}
  .logo img{max-width:240px;width:80%;height:auto;display:block}
  h1{font-size:14px;font-weight:300;text-align:center;letter-spacing:0.22em;text-transform:uppercase;font-family:'Outfit','Inter',sans-serif;color:var(--ink-soft)}
  .sub{text-align:center;color:var(--ink-soft);font-size:11px;margin-top:8px;margin-bottom:28px;letter-spacing:0.06em;text-transform:uppercase}
  .divider{height:1px;background:var(--line);margin:18px 0 4px}
  label{display:block;font-size:11px;font-weight:500;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;margin-top:14px}
  input{
    width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:6px;
    font-family:inherit;font-size:14px;color:var(--ink);outline:none;transition:border .15s;
  }
  input:focus{border-color:var(--accent)}
  button{
    width:100%;padding:13px;background:var(--accent);color:white;border:none;border-radius:6px;
    font-family:'Outfit','Inter',sans-serif;font-size:13px;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;margin-top:24px;transition:background .15s;
  }
  button:hover{background:var(--accent-hover)}
  button:disabled{background:var(--ink-soft);cursor:not-allowed}
  .erro{background:var(--red-soft);color:var(--red);padding:10px 12px;border-radius:6px;font-size:13px;margin-top:14px;display:none}
  .erro.show{display:block}
  .footer{text-align:center;font-size:10px;color:var(--ink-soft);margin-top:22px;letter-spacing:0.10em;text-transform:uppercase}
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">
    <img src="./imgs/logo-union511.png" alt="Union 511 Residence Mall">
  </div>
  <h1>Gestão de Locação</h1>
  <p class="sub">CRNW 511 Noroeste · Brasília/DF</p>
  <div class="divider"></div>

  <form id="login-form">
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="email" placeholder="seu@email.com">

    <label for="senha">Senha</label>
    <input type="password" id="senha" required autocomplete="current-password" placeholder="••••••••">

    <div class="erro" id="erro"></div>

    <button type="submit" id="btn-entrar">Entrar</button>
  </form>

  <div class="footer">Acesso restrito · Union 511 Noroeste</div>
</div>

<script type="module">
import { signIn, isLogged, MOCK_MODE } from './js/auth.js';

// Se já está logado, manda pro app
if (await isLogged()) {
  window.location.href = './index.html';
}

const form = document.getElementById('login-form');
const erro = document.getElementById('erro');
const btn = document.getElementById('btn-entrar');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  erro.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Entrando...';

  const email = document.getElementById('email').value;
  const senha = document.getElementById('senha').value;

  try {
    await signIn(email, senha);
    window.location.href = './index.html';
  } catch (err) {
    erro.textContent = err.message || 'Email ou senha incorretos.';
    erro.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
});

// Em modo mock, mostra dica
if (MOCK_MODE) {
  const dica = document.createElement('div');
  dica.style.cssText = 'background:#fef0d8;color:#854F0B;padding:10px 12px;border-radius:6px;font-size:11px;margin-top:14px;line-height:1.5';
  dica.innerHTML = '<strong>Modo de demonstração ativo</strong><br>Use email: <code>demo@union511.app</code> e qualquer senha';
  form.appendChild(dica);
}
</script>
</body>
</html>
